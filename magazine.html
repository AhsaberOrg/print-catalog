<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجلة البر التنموية - دليل برامج 2027م</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; padding: 0; }
        .tajawal { font-family: 'Tajawal', sans-serif; }
        .text-justify-custom { text-align: justify; text-justify: distribute; }
        
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-before: always; break-before: page; page-break-after: avoid; break-after: avoid; }
            body { background-color: white; }
            .magazine-page { box-shadow: none !important; margin: 0 !important; width: 210mm !important; height: 297mm !important; max-height: 297mm !important; overflow: hidden !important; page-break-inside: avoid; break-inside: avoid; }
        }

        .magazine-page {
            width: 210mm;
            height: 297mm;
            max-height: 297mm;
            margin: 10mm auto;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 12mm 18mm;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body class="py-10">

    <!-- زر الطباعة العائم -->
    <div class="fixed top-6 left-6 z-50 no-print">
        <button onclick="window.print()" class="px-6 py-3 bg-[#1b4332] text-[#d4af37] font-black rounded-2xl shadow-2xl hover:bg-[#2d6a4f] transition flex items-center gap-2 border-2 border-[#d4af37] cursor-pointer">
            <span class="text-xl">🖨️</span> طباعة المجلة / حفظ PDF
        </button>
    </div>

    <div id="magazineContainer">
        <!-- صفحة الغلاف الرئيسية للمجلة -->
        <div class="magazine-page border-8 border-[#1b4332] bg-gradient-to-b from-[#1b4332] to-[#081c15] text-white text-center py-12">
            <div class="w-32 h-32 mx-auto rounded-3xl bg-white p-2.5 shadow-2xl flex items-center justify-center border-4 border-[#d4af37] overflow-hidden">
                <img src="logo.png" alt="شعار جمعية البر بالأحساء" class="w-full h-full object-contain bg-transparent">
            </div>

            <div class="my-auto px-6 space-y-4">
                <h1 class="text-3xl sm:text-4xl font-black tajawal text-[#d4af37] tracking-wide leading-tight">دليل البرامج والمشاريع التنموية</h1>
                <p class="text-xl font-bold text-white tracking-wide pt-1">خطة عام 2027م</p>
                <div class="w-20 h-1 bg-[#d4af37] mx-auto my-3 rounded-full"></div>
                <p class="text-[#52b788] text-base font-semibold max-w-md mx-auto">مستفيدون ممكنون، خدمات شاملة، موارد مستدامة</p>
            </div>

            <div></div>
        </div>
    </div>

    <!-- تحميل ملف البيانات -->
    <script src="projects.js"></script>
    <script>
        // دالة تنظيف النصوص وإضافة نقطة ختامية لكل جملة تعداد
        function formatToList(text) {
            if (!text) return '<li>-</li>';
            let cleaned = text.replace(/،\./g, '.').replace(/\.،/g, '.').trim();
            let parts = cleaned.split(/(?<=[.!?])\s+/).filter(p => p.length > 3);
            if (parts.length <= 1) {
                parts = cleaned.split(/،\s+/).filter(p => p.length > 3);
            }
            if (parts.length === 0) parts = [cleaned];

            return parts.map(part => {
                let cleanPart = part.replace(/^[•\-\*\d+\.]\s*/, '').replace(/[.،]$/, '').trim();
                if (!cleanPart) return '';
                // إضافة نقطة ختامية لكل جملة بانتظام
                return `<li class="flex items-start gap-1.5 mb-1"><span class="text-[#d4af37] font-extrabold mt-0.5">•</span><span class="text-gray-700 text-justify-custom">${cleanPart}.</span></li>`;
            }).filter(Boolean).join('');
        }

        window.onload = function() {
            if (typeof programsData !== 'undefined') {
                const container = document.getElementById('magazineContainer');

                const initiativeDescriptions = {
                    "مبادرة جودة الحياة": "مجموعة من البرامج والأنشطة التي تهدف لتزويد المستفيدين بالمهارات والأدوات اللازمة التي تعدهم لتحقيق طموحاتهم، من إكمال دراستهم، واكتساب المهارات اللازمة للمنافسة في سوق العمل للوصول لتحقيق ضروريات الحياة.",
                    "مبادرة الابتكار والريادة": "تعنى بناء القدرات الريادية ودعم المبادرات الطموحة للوصول لمرحلة النمو في العائدات والاستقلالية، والانتقال بالمستفيدين من مرحلة الاحتياج إلى مرحلة الغنى والاستغناء.",
                    "مبادرة بناء القدرات": "مجموعة من المبادرات التي تهدف لتنمية قدرات المستفيدين في مراحل حياتهم سواء في المرحلة الجامعية أو ما يعادلها.",
                    "مبادرة النمو والتميز": "تعنى بالسعي المستمر للنمو في الأعمال والأثر والاستدامة عبر منظومة متكاملة لسد الاحتياج وتمكين المستفيدين بمعايير جودة عالية تُقاس برضاهم وما يحققونه وما تحققه الجمعية من نجاحات وجوائز."
                };

                const initiatives = [...new Set(programsData.map(p => p.category))];

                initiatives.forEach(initName => {
                    const initPrograms = programsData.filter(p => p.category === initName);
                    const customDesc = initiativeDescriptions[initName] || `تضم هذه المبادرة (${initPrograms.length}) برنامجاً ومشروعاً نوعياً صُممت خصيصاً لتحقيق الأثر المستدام.`;

                    // 1. صفحة غلاف الفاصل للمبادرة
                    const coverPage = document.createElement('div');
                    coverPage.className = "magazine-page page-break text-center bg-gradient-to-br from-gray-900 via-[#1b4332] to-gray-900 text-white border-y-8 border-[#d4af37]";
                    coverPage.innerHTML = `
                        <div class="absolute top-6 right-6 w-14 h-14 bg-white p-2 rounded-2xl flex items-center justify-center border border-[#d4af37]/30 shadow-md">
                            <img src="logo.png" alt="شعار الجمعية" class="w-full h-full object-contain bg-transparent">
                        </div>
                        <div></div>
                        <div class="max-w-2xl mx-auto px-6 py-auto">
                            <span class="text-[#d4af37] font-bold text-sm tracking-widest uppercase bg-[#d4af37]/10 px-4 py-1.5 rounded-full border border-[#d4af37]/30">المسار الاستراتيجي</span>
                            <h2 class="text-3xl sm:text-4xl font-black tajawal mt-5 text-white leading-tight">${initName}</h2>
                            <p class="text-gray-200 text-base mt-6 leading-relaxed bg-white/5 p-6 rounded-2xl border border-white/10 text-justify-custom">${customDesc}</p>
                            <div class="mt-8 inline-block px-5 py-2 bg-[#d4af37] text-[#1b4332] font-black text-sm rounded-full">
                                عدد المشاريع: (${initPrograms.length}) برنامجاً ومشروعاً
                            </div>
                        </div>
                        <div></div>
                    `;
                    container.appendChild(coverPage);

                    // 2. صفحات البرامج مع ضبط المحاذاة الكاملة (Justify)
                    for (let i = 0; i < initPrograms.length; i += 2) {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = "magazine-page page-break border-2 border-gray-200";
                        
                        let pageContent = `
                            <div class="border-b-2 border-[#1b4332] pb-2 mb-3 flex justify-between items-center">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-8 h-8 rounded-lg bg-white p-1 shadow-sm border border-emerald-900/20 flex items-center justify-center overflow-hidden">
                                        <img src="logo.png" alt="شعار" class="w-full h-full object-contain bg-transparent">
                                    </div>
                                    <span class="text-sm font-bold text-[#d4af37] bg-[#1b4332] px-3.5 py-1 rounded-md">${initName}</span>
                                </div>
                                <span class="text-xs font-bold text-gray-500">خطة برامج التنمية 2027م</span>
                            </div>
                            <div class="flex flex-col justify-between flex-1 space-y-4">
                        `;

                        const batch = initPrograms.slice(i, i + 2);
                        batch.forEach((prog, idx) => {
                            const globalIndex = i + idx + 1;
                            
                            const reasonsHtml = formatToList(prog.reasons);
                            
                            let outputsText = '';
                            if (prog.outputs && prog.outputs.length > 0) {
                                outputsText = prog.outputs.join('. ');
                            } else {
                                outputsText = prog.description ? 'تحقيق الأثر التنموي المستدام للمستفيدين' : '-';
                            }
                            const outputsHtml = formatToList(outputsText);

                            pageContent += `
                                <div class="bg-gray-50 p-4 rounded-xl border-r-4 border-[#1b4332] shadow-sm relative flex-1 flex flex-col justify-center">
                                    <div class="flex justify-between items-start gap-3 mb-2">
                                        <div class="flex items-center gap-3">
                                            <span class="w-7 h-7 rounded-lg bg-[#1b4332] text-[#d4af37] font-black text-xs flex items-center justify-center shadow border border-[#d4af37]/30 shrink-0">
                                                ${globalIndex}
                                            </span>
                                            <h3 class="text-base font-black text-[#1b4332] tajawal">${prog.title}</h3>
                                        </div>
                                        <span class="text-xs font-extrabold bg-[#d4af37]/20 text-yellow-800 px-3 py-0.5 rounded-md border border-[#d4af37]/40 shrink-0">${prog.target}</span>
                                    </div>
                                    
                                    <div class="space-y-2 text-xs sm:text-sm text-gray-700 leading-relaxed pr-1">
                                        <p><strong class="text-gray-900">الوصف:</strong> <span class="text-justify-custom inline-block w-full">${prog.description || '-'}.</span></p>
                                        
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2 pt-2 border-t border-gray-200/60">
                                            <div>
                                                <strong class="text-[#1b4332] block mb-1">المبررات:</strong>
                                                <ul class="text-xs space-y-0.5">${reasonsHtml}</ul>
                                            </div>
                                            <div>
                                                <strong class="text-emerald-800 block mb-1">المخرجات المستهدفة:</strong>
                                                <ul class="text-xs space-y-0.5">${outputsHtml}</ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                        pageContent += `
                            </div>
                            <div class="pt-2 border-t border-gray-200 text-center text-xs text-gray-400 font-semibold flex justify-between items-center">
                                <span>جمعية البر بالأحساء - إدارة الاستثمار والبرامج التنموية</span>
                                <span>2027م</span>
                            </div>
                        `;

                        pageDiv.innerHTML = pageContent;
                        container.appendChild(pageDiv);
                    }
                });
            }
        };
    </script>
</body>
</html>
