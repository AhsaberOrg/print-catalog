<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدليل المختصر للبرامج التنموية لعام 2027م - للطباعة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #ffffff; color: #111; font-size: 11pt; }
        @media print {
            body { font-size: 10pt; }
            .no-print { display: none !important; }
            page { margin: 1cm; }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
        }
    </style>
</head>
<body class="p-6">

    <!-- رأس الصفحة للطباعة -->
    <div class="flex justify-between items-center border-b-2 border-emerald-800 pb-4 mb-6">
        <div>
            <h1 class="text-2xl font-black text-emerald-900">جمعية البر بالأحساء</h1>
            <p class="text-sm font-bold text-gray-600">إدارة الاستثمار والبرامج التنموية - الدليل المختصر لبرامج ومشاريع عام 2027م</p>
        </div>
        <button onclick="window.print()" class="no-print px-6 py-2 bg-emerald-800 text-white font-bold rounded-xl shadow hover:bg-emerald-700 transition">
            🖨️ طباعة الدليل المختصر / حفظ PDF
        </button>
    </div>

    <!-- جدول البرامج المختصر -->
    <table class="w-full border-collapse border border-gray-300 text-right">
        <thead>
            <tr class="bg-emerald-900 text-white text-xs">
                <th class="border border-gray-300 p-2 w-12 text-center">م</th>
                <th class="border border-gray-300 p-2 w-48">اسم البرنامج / المشروع</th>
                <th class="border border-gray-300 p-2 w-36">المبادرة الاستراتيجية</th>
                <th class="border border-gray-300 p-2 w-24 text-center">المستهدف</th>
                <th class="border border-gray-300 p-2">وصف مختصر والمخرج القياسي</th>
            </tr>
        </thead>
        <tbody id="printTableBody" class="text-xs">
            <!-- سيتم تعبئة البيانات تلقائياً من ملف projects.js -->
        </tbody>
    </table>

    <!-- تحميل بيانات البرامج -->
    <script src="projects.js"></script>
    <script>
        window.onload = function() {
            const tbody = document.getElementById('printTableBody');
            if (typeof programsData !== 'undefined') {
                programsData.forEach((prog, index) => {
                    const tr = document.createElement('tr');
                    tr.className = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                    tr.innerHTML = `
                        <td class="border border-gray-300 p-2 text-center font-bold text-gray-600">${index + 1}</td>
                        <td class="border border-gray-300 p-2 font-bold text-emerald-900">${prog.title}</td>
                        <td class="border border-gray-300 p-2 text-gray-700 font-semibold">${prog.category}</td>
                        <td class="border border-gray-300 p-2 text-center text-gray-700">${prog.target}</td>
                        <td class="border border-gray-300 p-2 text-gray-600 leading-relaxed">
                            <span class="font-bold text-gray-800">الوصف:</span> ${prog.description ? prog.description.substring(0, 140) + '...' : ''}
                            <br><span class="font-bold text-emerald-800">المخرج/المبررات:</span> ${prog.reasons ? prog.reasons.substring(0, 120) + '...' : ''}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        };
    </script>
</body>
</html>
